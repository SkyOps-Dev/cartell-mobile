buildscript {
    ext {
        // compile/target 36 and min 24 match the Flutter app (spec 01 §2.1). The RN 0.87 template
        // defaults to compileSdk 37; NDK stays at the RN default (it builds RN's own native code).
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Turns google-services.json into the app's Firebase resources, as in Flutter's build
        // (which uses 4.4.0 with Android Gradle Plugin 8.11.1). 4.5.0 is the version
        // @react-native-firebase 27.1.0 is built and tested with, on React Native 0.87's Android
        // Gradle Plugin 9; the resources it generates from the same file are the same.
        classpath("com.google.gms:google-services:4.5.0")
    }
}

apply plugin: "com.facebook.react.rootproject"
